<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Villa dei Limoni</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Josefin+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<header class="kopf">
  <svg class="motiv motiv-links" viewBox="0 0 160 120" aria-hidden="true">
    <!-- Olivenzweig mit Fruechten, eine Zitrone mit Blatt -->
    <path d="M8 96 C40 80 70 62 112 40" stroke="#5b8a3c" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g fill="#6aa14a">
      <ellipse cx="34" cy="78" rx="13" ry="5" transform="rotate(-50 34 78)"/><ellipse cx="44" cy="90" rx="13" ry="5" transform="rotate(20 44 90)"/>
      <ellipse cx="66" cy="60" rx="13" ry="5" transform="rotate(-55 66 60)"/><ellipse cx="78" cy="72" rx="13" ry="5" transform="rotate(15 78 72)"/>
      <ellipse cx="98" cy="42" rx="12" ry="4.5" transform="rotate(-60 98 42)"/>
    </g>
    <g fill="#2b2f45"><ellipse cx="54" cy="70" rx="5" ry="6.5"/><ellipse cx="88" cy="54" rx="5" ry="6.5"/></g>
    <ellipse cx="128" cy="92" rx="22" ry="17" fill="#f7d43a"/><ellipse cx="121" cy="86" rx="7" ry="4" fill="#fff3a8" opacity=".7"/>
    <path d="M140 76 c10 -10 18 -8 20 -2 c-8 2 -14 4 -20 2z" fill="#4e8c3c"/>
  </svg>
  <h1><span class="v1">Villa</span> <span class="v2">dei</span> <span class="v3">Limoni</span></h1>
  <p class="unterzeile">Una stagione in Liguria</p>
  <svg class="motiv motiv-rechts" viewBox="0 0 160 120" aria-hidden="true">
    <!-- Sternblueten und Wellen -->
    <g fill="#f8c9c3"><g transform="translate(40 30)"><ellipse rx="4" ry="9" cy="-8"/><ellipse rx="4" ry="9" cy="-8" transform="rotate(72)"/><ellipse rx="4" ry="9" cy="-8" transform="rotate(144)"/><ellipse rx="4" ry="9" cy="-8" transform="rotate(216)"/><ellipse rx="4" ry="9" cy="-8" transform="rotate(288)"/><circle r="3" fill="#f2b33a"/></g></g>
    <g fill="#fff6e8"><g transform="translate(110 60) scale(.8)"><ellipse rx="4" ry="9" cy="-8"/><ellipse rx="4" ry="9" cy="-8" transform="rotate(72)"/><ellipse rx="4" ry="9" cy="-8" transform="rotate(144)"/><ellipse rx="4" ry="9" cy="-8" transform="rotate(216)"/><ellipse rx="4" ry="9" cy="-8" transform="rotate(288)"/><circle r="3" fill="#f2b33a"/></g></g>
    <g stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M20 96 c8 -8 16 -8 22 0 c6 -8 14 -8 22 0"/><path d="M84 106 c8 -8 16 -8 22 0 c6 -8 14 -8 22 0"/>
    </g>
  </svg>
</header>
<main class="wrap" id="app">
  <section class="buehne">
    <div class="leinwand">
      <canvas id="villa" aria-label="Die Villa dei Limoni"></canvas>
      <button class="tonknopf" id="tonknopf" aria-pressed="false">Ton aus</button>
    </div>
    <dl class="kennzahlen" id="kennzahlen" aria-live="polite"></dl>
  </section>
  <section class="panel" id="panel"></section>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
